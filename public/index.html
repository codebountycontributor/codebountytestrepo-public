<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Car Listings Search</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 20px; }
      input, select { margin: 4px 0; padding: 6px; }
      .card { border: 1px solid #ddd; padding: 10px; margin: 8px 0; }
    </style>
  </head>
  <body>
    <h1>Car Listings Search 🔎</h1>

    <div>
      <input id="q" placeholder="Search make, model, description" style="width:60%" />
      <select id="sortBy">
        <option value="">Sort</option>
        <option value="priceAsc">Price ↑</option>
        <option value="priceDesc">Price ↓</option>
        <option value="yearDesc">Year ↓</option>
        <option value="yearAsc">Year ↑</option>
        <option value="distanceAsc">Distance ↑</option>
        <option value="distanceDesc">Distance ↓</option>
      </select>
      <button id="search">Search</button>
    </div>

    <div style="margin-top:8px;">
      <label>Lat: <input id="lat" placeholder="latitude" style="width:120px" /></label>
      <label>Lon: <input id="lon" placeholder="longitude" style="width:120px" /></label>
      <button id="locate">Use my location</button>
    </div>

    <div id="results"></div>

    <script>
      async function search() {
        const q = document.getElementById('q').value;
        const sortBy = document.getElementById('sortBy').value;
        const lat = document.getElementById('lat').value;
        const lon = document.getElementById('lon').value;
        let url = `/api/search?q=${encodeURIComponent(q)}&sortBy=${encodeURIComponent(sortBy)}`;
        if (lat) url += `&lat=${encodeURIComponent(lat)}`;
        if (lon) url += `&lon=${encodeURIComponent(lon)}`;
        const res = await fetch(url);
        const data = await res.json();
        const container = document.getElementById('results');
        container.innerHTML = `<p>Found ${data.total} result(s)</p>`;
        data.results.forEach(car => {
          const div = document.createElement('div');
          div.className = 'card';
          const distanceDisplay = car.distance ? ` — ${Number(car.distance).toFixed(1)} mi away` : '';
          div.innerHTML = `<strong>${car.year} ${car.make} ${car.model}</strong> — $${car.price}${distanceDisplay}<br/>${car.description}`;
          container.appendChild(div);
        });
      }

      document.getElementById('search').addEventListener('click', search);
      // quick search on enter
      document.getElementById('q').addEventListener('keypress', (e) => { if (e.key === 'Enter') search(); });

      document.getElementById('locate').addEventListener('click', () => {
        if (!navigator.geolocation) return alert('Geolocation not supported');
        navigator.geolocation.getCurrentPosition(pos => {
          document.getElementById('lat').value = pos.coords.latitude;
          document.getElementById('lon').value = pos.coords.longitude;
        }, err => alert('Unable to get location: ' + err.message));
      });

      // initial load
      search();
    </script>
  </body>
</html>
